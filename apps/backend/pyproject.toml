[project]
name = "hellosquad"
version = "0.1.0"
description = "Backend do HelloSquad: API (FastAPI), worker e scheduler."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hellosquad-api = "hellosquad.api.main:run"
hellosquad-worker = "hellosquad.worker.main:run"
hellosquad-scheduler = "hellosquad.scheduler.main:run"
hellosquad-local-db = "hellosquad.local_db:run"
hellosquad-openapi = "hellosquad.api.openapi:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: usa o Supabase local no ar (make up && make seed) e o .env da raiz",
]
