[project]
name = "hellosquad-mocks"
version = "0.1.0"
description = "Mocks locais dos provedores externos do HelloSquad (Meta, GA4, Search Console, Google Business Profile). Só local, sem rede."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
hellosquad-mocks = "hellosquad_mocks.main:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# O TestClient do Starlette avisa que vai trocar httpx por httpx2; o aviso não muda o teste.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
