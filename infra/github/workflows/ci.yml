# CI do HelloSquad: lint e testes. Sem deploy, sem segredo, sem passo de nuvem.
#
# ESTACIONADO AQUI (J0): o token de push desta máquina não tem o escopo `workflow`, e o GitHub
# recusa criar arquivos em .github/workflows/ sem ele. Para ativar, quem tiver token com o escopo:
#   git mv infra/github/workflows/ci.yml .github/workflows/ci.yml && git commit && git push
# (ou criar .github/workflows/ci.yml pela interface do GitHub com este conteúdo).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.28"
          working-directory: apps/backend
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Os testes marcados `integration` precisam do Supabase local (make up && make seed) e rodam
      # no `make test`. Aqui ficam os unitários; um job com `supabase start` pode cobri-los depois.
      - run: uv run pytest -m "not integration"

  web:
    name: Web (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Versão do pnpm vem do campo packageManager do package.json da raiz.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
